      <stop offset="0" stop-color="#ff7a59" stop-opacity=".30"/>
      <stop offset=".58" stop-color="#ff7a59" stop-opacity=".12"/>
      <stop offset="1" stop-color="#ff7a59" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blue" cx="85%" cy="12%" r="52%">
      <stop offset="0" stop-color="#60a5fa" stop-opacity=".30"/>
      <stop offset=".58" stop-color="#60a5fa" stop-opacity=".12"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="teal" cx="45%" cy="85%" r="56%">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity=".25"/>
      <stop offset=".58" stop-color="#2dd4bf" stop-opacity=".10"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
